# Conditional defaults
BUILD_INFO ?= NaN
PTGB_BUILD_LANGUAGE ?= 1

# Defaults (don't touch!)
PRINT_LINK_DATA = 0
INSTANT_TEXT_SPEED = 0
IGNORE_GAME_PAK = 0
IGNORE_GAME_PAK_SPRITES = 0
IGNORE_LINK_CABLE = 0
IGNORE_MG_E4_FLAGS = 0
IGNORE_UNRECEIVED_PKMN = 0
FORCE_TUTORIAL = 0
DONT_REMOVE_PKMN = 0
DONT_HIDE_INVALID_PKMN = 0
IGNORE_DEX_COMPLETION = 0
FORCE_ALL_CAUGHT = 0
WRITE_CABLE_DATA_TO_SAVE = 0
SHOW_DATA_PACKETS = 0
DISPLAY_CONTROL_CHAR = 0
PAYLOAD_EXPORT_TEST = 0
DONT_TRANSFER_POKEMON_AT_INDEX_X = 0
ENABLE_TEXT_DEBUG_SCREEN = 0
DEBUG_PAYLOADS = 0

# Debug configuration block
ifeq ($(DEBUG_MODE),1)
	PRINT_LINK_DATA = 0
	INSTANT_TEXT_SPEED = 0
	IGNORE_GAME_PAK = 1
	IGNORE_GAME_PAK_SPRITES = 0
	IGNORE_LINK_CABLE = 1
	IGNORE_MG_E4_FLAGS = 1
	IGNORE_UNRECEIVED_PKMN = 0
	FORCE_TUTORIAL = 0
	DONT_REMOVE_PKMN = 0
	DONT_HIDE_INVALID_PKMN = 0
	IGNORE_DEX_COMPLETION = 0
	FORCE_ALL_CAUGHT = 1
	WRITE_CABLE_DATA_TO_SAVE = 0
	SHOW_DATA_PACKETS = 0
	DISPLAY_CONTROL_CHAR = 0
	PAYLOAD_EXPORT_TEST = 0
	DONT_TRANSFER_POKEMON_AT_INDEX_X = 0
	ENABLE_TEXT_DEBUG_SCREEN = 1
	DEBUG_PAYLOADS = 0
endif

POKEMON_INDEX_TO_SKIP = 5

DEBUG_GAME = EMERALD_ID
DEBUG_VERS = VERS_1_0
DEBUG_LANG = LANG_ENG

ENABLE_MATCH_PID = 1
ENABLE_DEBUG_SCREEN = 1

USE_CUSTOM_MALLOC = 1
CUSTOM_MALLOC_POOL_SIZE = 8192

# Propagate Makefile.cfg variables as defines
BUILDOPTS += -DPTGB_BUILD_LANGUAGE=$(PTGB_BUILD_LANGUAGE)
BUILDOPTS += -DDEBUG_MODE=$(DEBUG_MODE)
BUILDOPTS += -DBUILD_INFO=\"$(BUILD_INFO)\"
BUILDOPTS += -DPRINT_LINK_DATA=$(PRINT_LINK_DATA)
BUILDOPTS += -DINSTANT_TEXT_SPEED=$(INSTANT_TEXT_SPEED)
BUILDOPTS += -DIGNORE_GAME_PAK=$(IGNORE_GAME_PAK)
BUILDOPTS += -DIGNORE_GAME_PAK_SPRITES=$(IGNORE_GAME_PAK_SPRITES)
BUILDOPTS += -DIGNORE_LINK_CABLE=$(IGNORE_LINK_CABLE)
BUILDOPTS += -DIGNORE_MG_E4_FLAGS=$(IGNORE_MG_E4_FLAGS)
BUILDOPTS += -DIGNORE_UNRECEIVED_PKMN=$(IGNORE_UNRECEIVED_PKMN)
BUILDOPTS += -DFORCE_TUTORIAL=$(FORCE_TUTORIAL)
BUILDOPTS += -DDONT_REMOVE_PKMN=$(DONT_REMOVE_PKMN)
BUILDOPTS += -DDONT_HIDE_INVALID_PKMN=$(DONT_HIDE_INVALID_PKMN)
BUILDOPTS += -DIGNORE_DEX_COMPLETION=$(IGNORE_DEX_COMPLETION)
BUILDOPTS += -DFORCE_ALL_CAUGHT=$(FORCE_ALL_CAUGHT)
BUILDOPTS += -DWRITE_CABLE_DATA_TO_SAVE=$(WRITE_CABLE_DATA_TO_SAVE)
BUILDOPTS += -DSHOW_DATA_PACKETS=$(SHOW_DATA_PACKETS)
BUILDOPTS += -DDISPLAY_CONTROL_CHAR=$(DISPLAY_CONTROL_CHAR)
BUILDOPTS += -DPAYLOAD_EXPORT_TEST=$(PAYLOAD_EXPORT_TEST)
BUILDOPTS += -DDONT_TRANSFER_POKEMON_AT_INDEX_X=$(DONT_TRANSFER_POKEMON_AT_INDEX_X)
BUILDOPTS += -DPOKEMON_INDEX_TO_SKIP=$(POKEMON_INDEX_TO_SKIP)
BUILDOPTS += -DENABLE_TEXT_DEBUG_SCREEN=$(ENABLE_TEXT_DEBUG_SCREEN)
BUILDOPTS += -DDEBUG_PAYLOADS=$(DEBUG_PAYLOADS)
BUILDOPTS += -DDEBUG_GAME=$(DEBUG_GAME)
BUILDOPTS += -DDEBUG_VERS=$(DEBUG_VERS)
BUILDOPTS += -DDEBUG_LANG=$(DEBUG_LANG)
BUILDOPTS += -DENABLE_MATCH_PID=$(ENABLE_MATCH_PID)
BUILDOPTS += -DENABLE_DEBUG_SCREEN=$(ENABLE_DEBUG_SCREEN)
BUILDOPTS += -DUSE_CUSTOM_MALLOC=$(USE_CUSTOM_MALLOC)
BUILDOPTS += -DCUSTOM_MALLOC_POOL_SIZE=$(CUSTOM_MALLOC_POOL_SIZE)